aid: looksharp
name: LookSharp
description: LookSharp (formerly InternMatch) was the largest internship and entry-level
  jobs marketplace dedicated entirely to US college students and new grads, connecting
  a marketplace of job-seeking students with employers who used its enterprise recruiting
  products to build employment brand and streamline campus hiring. Founded in 2009
  by Andrew Maguire and Nathan Parcells and backed by 500 Global, LookSharp was acquired
  by WayUp in 2017; its internmatch.com domain now redirects to wayup.com and the
  brand no longer operates independently. This profile documents a defunct/acquired
  company with no public API or developer surface.
